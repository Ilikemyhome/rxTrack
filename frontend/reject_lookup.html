<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reject Code Lookup</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
        }
        input {
            width: 100%;
            padding: 12px;
            font-size: 18px;
            margin-bottom: 10px;
        }
        button {
            padding: 12px 20px;
            font-size: 18px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background-color: #45a049;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background: #f4f4f4;
        }
        .label {
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h2>Insurance Reject Code Lookup</h2>
    <input id="codeInput" type="text" placeholder="Enter reject code (e.g., 75)">
    <button onclick="lookupCode()">Lookup</button>

    <div id="result" class="result-box" style="display:none;"></div>

    <script>
        async function lookupCode() {
            const code = document.getElementById("codeInput").value.trim().toUpperCase();
            if (!code) return;

            const response = await fetch(`http://127.0.0.1:8000/api/reject/interpret/?code=${code}`);
            const data = await response.json();

            const box = document.getElementById("result");
            box.style.display = "block";

            box.innerHTML = `
                <div class="label">Code:</div> ${data.code}
                <div class="label">Reason:</div> ${data.reason}
                <div class="label">Category:</div> ${data.category}
                <div class="label">Next Steps:</div> ${data.next_steps}
                <div class="label">Details:</div>
                <ul>
                    ${data.details.map(d => `<li>${d}</li>`).join("")}
                </ul>
            `;
        }
    </script>
    
</body>
</html>
